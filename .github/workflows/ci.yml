name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"

jobs:
  build-test:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: dotnet restore LocalMcpServer.slnx
      - run: dotnet build LocalMcpServer.slnx --configuration Release --no-restore
      - run: dotnet test LocalMcpServer.slnx --configuration Release --no-build
      - name: Smoke publish (win-x64)
        run: dotnet publish src/LocalMcpServer/LocalMcpServer.csproj -c Release -r win-x64 -o publish/smoke
